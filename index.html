<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>ヘクス地雷ゲーム</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body {
    margin: 0;
    font-family: sans-serif;
    background: #0f172a;
    color: white;
    text-align: center;
}

h1 {
    margin: 10px;
    font-size: 24px;
}

#game {
    display: grid;
    grid-template-columns: repeat(9, 1fr);
    gap: 4px;
    max-width: 420px;
    margin: auto;
}

.hex {
    width: 100%;
    aspect-ratio: 1;
    background: #1e293b;
    clip-path: polygon(
        50% 0%, 100% 25%, 100% 75%,
        50% 100%, 0% 75%, 0% 25%
    );
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    user-select: none;
}

.open { background: #94a3b8; color: black; }
.bomb { background: red; }
.flag { background: orange; }
.cursor { outline: 3px solid yellow; }

#status {
    margin: 10px;
}
</style>
</head>
<body>

<h1>💣 ヘクス地雷ゲーム</h1>
<div>タップ＝開く / 長押し＝フラグ</div>
<div id="status">プレイ中</div>
<div id="game"></div>

<script>
const size = 9;
const bombCount = 15;
let board = [];
let gameOver = false;
let cursor = 0;

const game = document.getElementById("game");

// 初期化
for (let i = 0; i < size * size; i++) {
    const cell = document.createElement("div");
    cell.className = "hex";
    cell.dataset.index = i;
    game.appendChild(cell);

    board.push({
        bomb: false,
        open: false,
        flag: false,
        count: 0
    });
}

// 爆弾配置
let placed = 0;
while (placed < bombCount) {
    let i = Math.floor(Math.random() * board.length);
    if (!board[i].bomb) {
        board[i].bomb = true;
        placed++;
    }
}

// 周囲カウント
for (let i = 0; i < board.length; i++) {
    board[i].count = getNeighbors(i).filter(n => board[n].bomb).length;
}

// カーソル
function updateCursor() {
    document.querySelectorAll(".hex").forEach(el => el.classList.remove("cursor"));
    game.children[cursor].classList.add("cursor");
}
updateCursor();

// ===== キーボード操作 =====
document.addEventListener("keydown", (e) => {
    if (gameOver) return;

    const x = cursor % size;
    const y = Math.floor(cursor / size);

    switch(e.key) {
        case "ArrowUp": if (y > 0) cursor -= size; break;
        case "ArrowDown": if (y < size - 1) cursor += size; break;
        case "ArrowLeft": if (x > 0) cursor -= 1; break;
        case "ArrowRight": if (x < size - 1) cursor += 1; break;
        case "j":
        case "J": openCell(cursor); break;
        case "f":
        case "F": toggleFlag(cursor); break;
    }

    updateCursor();
});

// ===== タッチ操作 =====
let pressTimer = null;

game.addEventListener("touchstart", (e) => {
    if (gameOver) return;

    const target = e.target.closest(".hex");
    if (!target) return;

    const idx = parseInt(target.dataset.index);
    cursor = idx;
    updateCursor();

    pressTimer = setTimeout(() => {
        toggleFlag(idx);
        pressTimer = null;
    }, 500); // 長押し0.5秒
});

game.addEventListener("touchend", (e) => {
    if (gameOver) return;

    const target = e.target.closest(".hex");
    if (!target) return;

    const idx = parseInt(target.dataset.index);

    if (pressTimer) {
        clearTimeout(pressTimer);
        openCell(idx); // 短押し＝開く
    }
});

// ===== フラグ =====
function toggleFlag(i) {
    const cell = board[i];
    if (cell.open) return;

    cell.flag = !cell.flag;
    game.children[i].classList.toggle("flag");
}

// ===== 開く =====
function openCell(i) {
    const cell = board[i];
    const el = game.children[i];

    if (cell.open || cell.flag) return;

    cell.open = true;
    el.classList.add("open");

    if (cell.bomb) {
        el.textContent = "💣";
        el.classList.add("bomb");
        gameOver = true;
        document.getElementById("status").textContent = "ゲームオーバー！";
        revealAll();
        return;
    }

    if (cell.count > 0) {
        el.textContent = cell.count;
    } else {
        getNeighbors(i).forEach(n => openCell(n));
    }

    checkClear();
}

// ===== 全表示 =====
function revealAll() {
    board.forEach((cell, i) => {
        if (cell.bomb) {
            game.children[i].textContent = "💣";
            game.children[i].classList.add("bomb");
        }
    });
}

// ===== クリア判定 =====
function checkClear() {
    const cleared = board.every(c => c.open || c.bomb);
    if (cleared) {
        gameOver = true;
        document.getElementById("status").textContent = "クリア！🎉";
    }
}

// ===== 隣接 =====
function getNeighbors(i) {
    const x = i % size;
    const y = Math.floor(i / size);

    const dirs = [
        [1,0], [-1,0], [0,1], [0,-1],
        [1,-1], [-1,1]
    ];

    let result = [];
    dirs.forEach(([dx, dy]) => {
        const nx = x + dx;
        const ny = y + dy;
        if (nx >= 0 && ny >= 0 && nx < size && ny < size) {
            result.push(ny * size + nx);
        }
    });

    return result;
}
</script>

</body>
</html>
